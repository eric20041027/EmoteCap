<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmoteCap private Studio camera measurements</title>
<style>
.camera-measurement-panel{box-sizing:border-box;max-width:1280px;margin:auto;padding:20px;overflow-wrap:anywhere}
.camera-measurement-panel h1{font-size:24px}.camera-measurement-panel fieldset{min-width:0;border:1px solid #77879a;padding:14px}
.camera-measurement-metadata{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.camera-measurement-metadata label{display:grid;gap:4px}.camera-measurement-metadata input:not([type=checkbox]),.camera-measurement-metadata select{width:100%;min-width:0;box-sizing:border-box;font:inherit;padding:6px}
.camera-measurement-metadata .camera-measurement-choice{display:flex;gap:8px;grid-column:1/-1;align-items:center}
.camera-measurement-actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.camera-measurement-actions button,.camera-measurement-actions a{font:inherit;padding:8px 12px}
.camera-measurement-panel a{color:#9ac6ff}.camera-measurement-panel :focus-visible{outline:3px solid #9ac6ff;outline-offset:2px}
</style></head><body><div id="root"></div><script type="module" src="/src/evaluation/CameraMeasurementsPage.tsx"></script></body></html>
