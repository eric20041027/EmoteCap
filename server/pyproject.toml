[project]
name = "emotecap-server"
version = "0.1.0"
description = "EmoteCap server: Blender FBX export, Live Link relay, Gemini slicing"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: runs real Blender headless (a few seconds); skip with -m 'not slow'"]
